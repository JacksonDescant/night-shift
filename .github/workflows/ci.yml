name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -e '.[dev]' flask
      - run: python -m pyflakes nightshift server tests
      - run: node --check server/static/app.js
      - run: git config --global user.email ci@example.com && git config --global user.name CI
      - run: python -m pytest -q
