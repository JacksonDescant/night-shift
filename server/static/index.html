<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Night Shift</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M20 4a12 12 0 1 0 8 20A10 10 0 0 1 20 4z' fill='%236366f1'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="Night Shift home">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M20 4a12 12 0 1 0 8 20A10 10 0 0 1 20 4z"/></svg>
      <span>Night Shift</span>
    </a>
    <nav class="repo-switch" id="repo-switch" aria-label="Repositories"></nav>
    <div class="topbar-actions">
      <a class="btn ghost" href="#/setup">Crew setup</a>
      <a class="btn ghost" href="#/connect">Connect repository</a>
      <button class="btn ghost icon" id="open-settings" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Zm8.3-2.6.1-1-.1-1 2-1.6-2-3.4-2.4 1a7.6 7.6 0 0 0-1.7-1L15.8 3h-3.9l-.4 2.6a7.6 7.6 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.6-.1 1 .1 1-2 1.6 2 3.4 2.4-1a7.6 7.6 0 0 0 1.7 1l.4 2.6h3.9l.4-2.6a7.6 7.6 0 0 0 1.7-1l2.4 1 2-3.4-2-1.6Z"/></svg>
      </button>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <dialog id="settings" aria-labelledby="settings-title">
    <form method="dialog" class="dialog-body" id="settings-form">
      <h2 id="settings-title">Settings</h2>
      <p class="muted">How the dashboard talks to the crew. These stay on this machine.</p>
      <label>Crew webhook URL
        <input name="crew_webhook_url" type="url" placeholder="The Watcher routine's webhook URL" autocomplete="off">
      </label>
      <label>Crew webhook Authorization
        <input name="crew_webhook_auth" type="password" placeholder="Leave blank to keep the current value" autocomplete="off">
      </label>
      <label>Progress token for the crew
        <span class="copy-row"><input name="ingest_token" readonly><button type="button" class="btn ghost" data-copy="ingest_token">Copy</button></span>
        <small class="muted">The crew sets this as NIGHTSHIFT_TOKEN to post progress to this dashboard.</small>
      </label>
      <div class="dialog-actions">
        <button class="btn ghost" value="cancel" formnovalidate>Cancel</button>
        <button class="btn primary" value="save" id="settings-save">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="hook" aria-labelledby="hook-title">
    <form method="dialog" class="dialog-body">
      <h2 id="hook-title">Wake the crew on every push</h2>
      <p class="muted">In the repository on GitHub: Settings → Webhooks → Add webhook.</p>
      <dl class="kv" id="hook-body"></dl>
      <div class="dialog-actions"><button class="btn primary" value="close">Done</button></div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/static/app.js"></script>
</body>
</html>
