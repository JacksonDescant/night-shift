[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nightshift"
version = "0.1.0"
description = "An autonomous crew of AI agents that proves security bugs with failing tests, fixes them, and merges only what it can prove."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6", "httpx>=0.27", "python-dotenv>=1", "pytest>=8",
  "bandit>=1.7", "pip-audit>=2.7",
  "fastapi>=0.110", "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pyflakes>=3"]

[project.scripts]
nightshift = "nightshift.cli:main"
nightshift-dashboard = "server.run:main"

[tool.setuptools]
packages = ["nightshift", "server"]

[tool.setuptools.package-data]
nightshift = ["rules/*.yml"]
server = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
